{{- /*
Fail-fast validation for the umbrella chart. Emits no resources — the guards run
at render time so mistakes are caught by `helm template`/`install`, not at
runtime. Keep this file free of any real Kubernetes output.
*/ -}}
{{- $id := .Values.identity | default dict -}}
{{- if not $id.model }}
{{- fail "identity.model is required (the full HuggingFace model name, e.g. Qwen/Qwen3-32B)." }}
{{- end }}
{{- if not $id.gateway }}
{{- fail "identity.gateway is required (the name of the pre-existing Gateway the HTTPRoute binds to)." }}
{{- end }}
{{- $ms := index .Values "llm-d-modelserver" | default dict -}}
{{- $keda := dig "autoscaling" "keda" dict $ms -}}
{{- if and $keda.enabled (not $keda.eppServiceName) }}
{{- fail "llm-d-modelserver.autoscaling.keda.eppServiceName is required when autoscaling is enabled: set it to \"<release>-epp\" (the router shares this umbrella's release name)." }}
{{- end }}
{{- /*
  P/D mode: enabling prefill MUTATES the decode pod — it must gain the routing-
  proxy sidecar and a vLLM port shift (8000 -> 8200 behind the sidecar). Fail
  fast if decode.spec is missing either, so this can't half-deploy at runtime.
*/ -}}
{{- if dig "prefill" "enabled" false $ms }}
{{- $decodeSpec := dig "decode" "spec" "template" "spec" dict $ms -}}
{{- $hasSidecar := false -}}
{{- range $ic := ($decodeSpec.initContainers | default list) }}
  {{- if or (eq ($ic.restartPolicy | default "") "Always") (contains "proxy" ($ic.name | default "")) (contains "sidecar" ($ic.name | default "")) }}{{- $hasSidecar = true }}{{- end }}
{{- end }}
{{- $cname := dig "decode" "containerName" "modelserver" $ms -}}
{{- $args := list -}}
{{- range $c := ($decodeSpec.containers | default list) }}
  {{- if eq ($c.name | default "") $cname }}{{- $args = concat $args ($c.args | default list) }}{{- end }}
{{- end }}
{{- $args = concat $args (dig "decode" "extraArgs" list $ms) -}}
{{- $hasPortShift := false -}}
{{- range $a := $args }}{{- if hasPrefix "--port" (toString $a) }}{{- $hasPortShift = true }}{{- end }}{{- end }}
{{- if not $hasSidecar }}
{{- fail "llm-d-modelserver.prefill.enabled is true (P/D mode) but decode.spec has NO routing-proxy sidecar. Add the sidecar (a native initContainer, restartPolicy: Always) to llm-d-modelserver.decode.spec — see examples/values-pd-disaggregation.yaml." }}
{{- end }}
{{- if not $hasPortShift }}
{{- fail "llm-d-modelserver.prefill.enabled is true (P/D mode) but decode's vLLM has no port shift. The decode engine must move to --port=8200 (the sidecar listens on 8000). Add it to decode.spec args or decode.extraArgs — see examples/values-pd-disaggregation.yaml." }}
{{- end }}
{{- end }}
{{- /*
  block-size consistency: precise-prefix-cache routing indexes KV blocks, so the
  EPP plugin's tokenProcessorConfig.blockSize MUST equal the model server's vLLM
  --block-size. They live in two unrelated spots (a plugin config string and the
  decode args) and can't be single-sourced (the plugin config is an opaque YAML
  string), so verify them here and fail fast on a missing/mismatched pair.
*/ -}}
{{- $router := index .Values "llm-d-router" | default dict -}}
{{- $pcc := dig "llmd" "router" "epp" "pluginsCustomConfig" dict $router -}}
{{- $pluginBS := "" -}}
{{- range $file, $content := $pcc }}
  {{- range $m := regexFindAll "blockSize:[ ]*[0-9]+" (toString $content) -1 }}
    {{- $pluginBS = regexFind "[0-9]+" $m -}}
  {{- end }}
{{- end }}
{{- if $pluginBS }}
{{- $bcname := dig "decode" "containerName" "modelserver" $ms -}}
{{- $bspec := dig "decode" "spec" "template" "spec" dict $ms -}}
{{- $bargs := list -}}
{{- range $c := ($bspec.containers | default list) }}
  {{- if eq ($c.name | default "") $bcname }}{{- $bargs = concat $bargs ($c.args | default list) }}{{- end }}
{{- end }}
{{- $bargs = concat $bargs (dig "decode" "extraArgs" list $ms) -}}
{{- $argStr := "" -}}
{{- range $a := $bargs }}{{- $argStr = printf "%s %s" $argStr (toString $a) -}}{{- end }}
{{- $argBS := "" -}}
{{- range $mm := regexFindAll "--block-size[= ][0-9]+" $argStr -1 }}{{- $argBS = regexFind "[0-9]+" $mm -}}{{- end }}
{{- if not $argBS }}
{{- fail (printf "block-size: pluginsCustomConfig sets blockSize=%s but the decode model server has NO --block-size arg. They must match for precise prefix-cache routing — add --block-size=%s to llm-d-modelserver.decode.spec args (or decode.extraArgs)." $pluginBS $pluginBS) }}
{{- end }}
{{- if ne $argBS $pluginBS }}
{{- fail (printf "block-size MISMATCH: pluginsCustomConfig blockSize=%s but decode --block-size=%s. They MUST be equal for precise prefix-cache routing (the EPP KV-block index would misalign with vLLM's blocks)." $pluginBS $argBS) }}
{{- end }}
{{- end }}
