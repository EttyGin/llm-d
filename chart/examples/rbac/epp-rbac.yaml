# =============================================================================
# EPP cluster-scoped RBAC — pre-provision these yourself (needs cluster-admin),
# then tell the chart NOT to create them with the single toggle:
#
#     llm-d-router.llmd.router.rbac.clusterRole.create: false
#     (see examples/values-byo-clusterrole.yaml)
#
# Only these two objects are affected by that toggle — the EPP ServiceAccount and
# its namespaced Roles/RoleBindings are still created by the chart as usual.
#
# Rendered with placeholders `release` / `namespace` — replace with your Helm
# release name and target namespace, e.g.:
#     sed 's/\brelease\b/ppc/g; s/\bnamespace\b/llm-d/g' epp-rbac.yaml | kubectl apply -f -
#
# NOTE: the chart only creates these when monitoring.prometheus.enabled=true, and
# they are only *used* when the EPP metrics auth is on. With auth off (default)
# you can skip them entirely with no functional change.
# =============================================================================
# Source: llm-d/charts/llm-d-router/charts/llmd/templates/rbac.yaml
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "release-namespace-epp"
  labels:
    app.kubernetes.io/name: release-epp
    app.kubernetes.io/version: "v0.9.0"
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
  - nonResourceURLs:
      - "/metrics"
    verbs:
      - get
---
# Source: llm-d/charts/llm-d-router/charts/llmd/templates/rbac.yaml
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "release-namespace-epp"
subjects:
  - kind: ServiceAccount
    name: release-epp
    namespace: namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: "release-namespace-epp"
