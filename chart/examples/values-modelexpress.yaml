# =============================================================================
# ModelExpress P2P weight transfer via the chart's `modelExpress` knob —
# single-node, direct-exec vLLM. This is the CHART-NATIVE equivalent of the
# manual `pip install modelexpress` shown in values-wide-ep-glm.yaml.
#
#   helm install mx . -n <ns> -f examples/values-modelexpress.yaml
#
# With decode.modelExpress.enabled the chart wires the server exactly like
# modelexpress/examples/dynamo_p2p_transfer_k8s/vllm (single node):
#   - an init container `pip install`s the client into a shared dir BEFORE the
#     server starts (exposed via PYTHONPATH=/mx-client),
#   - --load-format=mx is appended to the vLLM args,
#   - MODEL_EXPRESS_URL + MX_SERVER_ADDRESS are both set to serverAddress.
#
# The ModelExpress server itself is a separate Deployment (NOT created here) —
# point serverAddress at its Service (see the guide's ModelExpress service block).
# vLLM 0.23.0+ recognizes the `mx`/`modelexpress` load format natively; on older
# vLLM add VLLM_PLUGINS=modelexpress via modelExpress.extraEnv.
#
# The gateway name and HF secret name are the chart defaults, so they aren't
# restated here; accelerator defaults to gpu/nvidia.
# =============================================================================
identity:
  model: &model Qwen/Qwen2.5-0.5B-Instruct       # model.name + the vLLM serve args
  modelLabel: &modelLabel Qwen2.5-0.5B-Instruct  # model.label + InferencePool matchLabels
  guide: &guide modelexpress                      # guideLabel + InferencePool matchLabels

llm-d-router:
  llmd:
    router:
      modelServers:
        matchLabels:
          llm-d.ai/guide: *guide
          llm-d.ai/model: *modelLabel

llm-d-modelserver:
  model:
    name: *model
    label: *modelLabel
  guideLabel: *guide

  decode:
    # ── the whole feature ──────────────────────────────────────────────
    modelExpress:
      enabled: true
      serverAddress: mx-modelexpress:8000   # → MODEL_EXPRESS_URL + MX_SERVER_ADDRESS
      loadFormat: mx                        # → --load-format=mx appended to args
      install: true                         # → init container pip installs the client
      package: modelexpress
      # Publish caches only after vLLM's health endpoint is up (from the guide):
      extraEnv:
        - name: MX_ARTIFACT_READY_URL
          value: "http://127.0.0.1:8000/health"
    # ───────────────────────────────────────────────────────────────────
    image:
      repository: ghcr.io/llm-d/llm-d-cuda-dev
      tag: sha-a1bcf21
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: modelserver
              command: ["vllm", "serve"]     # direct-exec: args are vLLM flags
              args:
                - *model
                - --served-model-name
                - *model
                - --tensor-parallel-size=1
                - --trust-remote-code
              env:
                - name: HF_HOME
                  value: /models
                - name: HF_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: llm-d-hf-token
                      key: HF_TOKEN
              ports:
                - name: modelserver
                  containerPort: 8000
                  protocol: TCP
              resources:
                limits:
                  nvidia.com/gpu: "1"
                  memory: 32Gi
              volumeMounts:
                - name: shm
                  mountPath: /dev/shm
          volumes:
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
