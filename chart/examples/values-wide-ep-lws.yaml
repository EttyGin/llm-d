# =============================================================================
# guides/wide-ep-lws — WITH LeaderWorkerSet (multi-node wide expert parallelism).
# DeepSeek-R1, P/D disaggregation, DP across nodes via LWS (leader + workers).
#
#   helm install wide-ep . -n <ns> -f examples/values-wide-ep-lws.yaml
#
# ⚠ Real deployment target: a multi-node GPU cluster (e.g. 32×H200) with the
#   LeaderWorkerSet controller (https://lws.sigs.k8s.io) and RDMA. This renders a
#   `kind: LeaderWorkerSet` for each role. The vLLM engine args below are trimmed
#   to the wide-EP essentials — see guides/wide-ep-lws/modelserver/gpu/vllm/base/
#   {decode,prefill}.yaml for the full DP-supervisor launch script.
#
# The difference from values-wide-ep.yaml (no LWS) is ONLY:
#   workload: leaderWorkerSet  +  leaderWorkerSet.size (multi-node group).
# =============================================================================
_widx:
  model:      &model      deepseek-ai/DeepSeek-R1-0528
  modelLabel: &modelLabel DeepSeek-R1-0528
  sidecar:    &sidecar    ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.9.0

llm-d-modelserver:
  model: { name: *model, label: *modelLabel }
  guideLabel: wide-ep-lws
  accelerator: { variant: gpu, vendor: nvidia }

  # ---- Decode: LWS, DP across nodes ----
  decode:
    enabled: true
    workload: leaderWorkerSet
    leaderWorkerSet:
      size: 2                       # leader + 1 worker per replica (2 nodes)
    containerName: vllm
    image: { repository: ghcr.io/llm-d/llm-d-cuda-dev, tag: sha-a1bcf21 }
    spec:
      replicas: 1
      template:
        spec:
          initContainers:
            - name: routing-proxy
              image: *sidecar
              imagePullPolicy: Always
              restartPolicy: Always
              args:
                - --port=8000
                - --vllm-port=8200
                - --data-parallel-size=8   # sidecar fans out to DP ranks
                - --kv-connector=nixlv2
                - --secure-proxy=false
                - --enable-prefiller-sampling
              ports:
                - { name: rank0, containerPort: 8000, protocol: TCP }
          containers:
            - name: vllm
              command: ["/bin/bash", "-c"]
              args:
                # Trimmed — full DP-supervisor script is in the guide.
                - |-
                  exec vllm serve deepseek-ai/DeepSeek-R1-0528 \
                    --port 8200 --enable-expert-parallel \
                    --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                    --data-parallel-size-local $DP_SIZE_LOCAL \
                    --data-parallel-address ${LWS_LEADER_ADDRESS} \
                    --data-parallel-start-rank $(( ${LWS_WORKER_INDEX:-0} * DP_SIZE_LOCAL )) \
                    --kv_transfer_config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
              env:
                - { name: DP_SIZE_LOCAL, value: "8" }
                - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: llm-d-hf-token, key: HF_TOKEN } } }
                - { name: VLLM_NIXL_SIDE_CHANNEL_HOST, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
              ports:
                - { name: vllm, containerPort: 8200, protocol: TCP }
                - { name: nixl, containerPort: 5600, protocol: TCP }
              resources:
                limits: { nvidia.com/gpu: "8", rdma/ib: "1" }
              volumeMounts:
                - { name: shm, mountPath: /dev/shm }
          volumes:
            - name: shm
              emptyDir: { medium: Memory, sizeLimit: 40Gi }

  # ---- Prefill: LWS too ----
  prefill:
    enabled: true
    workload: leaderWorkerSet
    leaderWorkerSet:
      size: 2
    containerName: vllm
    image: { repository: ghcr.io/llm-d/llm-d-cuda, tag: v0.8.0 }
    spec:
      replicas: 1
      template:
        spec:
          containers:
            - name: vllm
              command: ["/bin/bash", "-c"]
              args:
                - |-
                  exec vllm serve deepseek-ai/DeepSeek-R1-0528 \
                    --port 8200 --enable-expert-parallel \
                    --data-parallel-size $((LWS_GROUP_SIZE * DP_SIZE_LOCAL)) \
                    --data-parallel-address ${LWS_LEADER_ADDRESS} \
                    --kv_transfer_config '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
              env:
                - { name: DP_SIZE_LOCAL, value: "8" }
                - { name: HF_TOKEN, valueFrom: { secretKeyRef: { name: llm-d-hf-token, key: HF_TOKEN } } }
                - { name: VLLM_NIXL_SIDE_CHANNEL_HOST, valueFrom: { fieldRef: { fieldPath: status.podIP } } }
              ports:
                - { name: vllm, containerPort: 8200, protocol: TCP }
                - { name: nixl, containerPort: 5600, protocol: TCP }
              resources:
                limits: { nvidia.com/gpu: "8", rdma/ib: "1" }
              volumeMounts:
                - { name: shm, mountPath: /dev/shm }
          volumes:
            - name: shm
              emptyDir: { medium: Memory, sizeLimit: 40Gi }

# ---- Router: wide-EP EPP (P/D plugins) ----
llm-d-router:
  llmd:
    router:
      tokenizer: { enabled: true, modelName: *model }
      modelServers:
        matchLabels:
          llm-d.ai/guide: "wide-ep-lws"
      epp:
        pluginsConfigFile: "wide-ep-lws-config.yaml"
        pluginsCustomConfig:
          wide-ep-lws-config.yaml: |
            apiVersion: llm-d.ai/v1alpha1
            kind: EndpointPickerConfig
            plugins:
            - type: disagg-headers-handler
            - type: always-disagg-pd-decider
            - type: disagg-profile-handler
              parameters:
                deciderPluginName: always-disagg-pd-decider
            - type: prefill-filter
            - type: decode-filter
            - type: prefix-cache-scorer
            - type: queue-scorer
            - type: active-request-scorer
            schedulingProfiles:
            - name: prefill
              plugins:
              - pluginRef: prefill-filter
              - pluginRef: prefix-cache-scorer
                weight: 3
              - pluginRef: queue-scorer
                weight: 2
              - pluginRef: active-request-scorer
                weight: 2
            - name: decode
              plugins:
              - pluginRef: decode-filter
              - pluginRef: active-request-scorer
