{{- define "llm-d-router.rbac" -}}
{{- /*
  VENDORED PATCH (llm-d umbrella): bring-your-own ClusterRole. See
  charts/llm-d-router/PATCHES.md — re-apply on OCI version bumps.
    router.rbac.clusterRole.create        (default true)  create the /metrics-auth ClusterRole
    router.rbac.clusterRole.existingName  (default "")     bind to this EXISTING ClusterRole instead
    router.rbac.clusterRoleBinding.create (default true)   create the binding (EPP SA -> ClusterRole)
*/ -}}
{{- $rbac := .Values.router.rbac | default dict -}}
{{- $crCfg := $rbac.clusterRole | default dict -}}
{{- $crCreate := dig "create" true $crCfg -}}
{{- $crName := $crCfg.existingName | default (include "llm-d-router.cluster-rbac-name" .) -}}
{{- $crbCreate := dig "clusterRoleBinding" "create" true $rbac -}}
{{- if .Values.router.monitoring.prometheus.enabled }}
{{- if $crCreate }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $crName }}
  labels:
    {{- include "llm-d-router.labels" . | nindent 4 }}
rules:
- apiGroups:
    - authentication.k8s.io
  resources:
    - tokenreviews
  verbs:
    - create
- apiGroups:
    - authorization.k8s.io
  resources:
    - subjectaccessreviews
  verbs:
    - create
- nonResourceURLs:
    - "/metrics"
  verbs:
    - get
---
{{- end }}
{{- if $crbCreate }}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "llm-d-router.cluster-rbac-name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "llm-d-router.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $crName }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-sa" (include "llm-d-router.name" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-router.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-sa" (include "llm-d-router.name" .) }}
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "llm-d-router.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-sa" (include "llm-d-router.name" .) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-d-router.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-router.labels" . | nindent 4 }}
---
{{- end }}
