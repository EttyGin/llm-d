{{- define "llm-d-router.rbac" -}}
{{- /*
  VENDORED PATCH (llm-d umbrella): bring-your-own ClusterRole. See
  charts/llm-d-router/PATCHES.md — re-apply on OCI version bumps.
    router.rbac.clusterRole.create        (default true)  ONE switch: false = create
        NEITHER the ClusterRole NOR the ClusterRoleBinding (all cluster-scoped
        RBAC — needs cluster-admin). Pre-provision them yourself; the EPP SA + its
        namespaced Roles are still created in-namespace, no admin needed.
    router.rbac.clusterRole.existingName  (default "")     only used if the chart
        creates the binding — the ClusterRole name it binds to.
    router.rbac.clusterRoleBinding.create (default = clusterRole.create)  advanced
        override: create the binding even when clusterRole.create is false.
*/ -}}
{{- $rbac := .Values.router.rbac | default dict -}}
{{- $crCfg := $rbac.clusterRole | default dict -}}
{{- $crCreate := dig "create" true $crCfg -}}
{{- $crName := $crCfg.existingName | default (include "llm-d-router.cluster-rbac-name" .) -}}
{{- /* binding defaults to the ClusterRole toggle: clusterRole.create:false skips BOTH (no cluster-admin needed) */ -}}
{{- $crbCreate := $crCreate -}}
{{- with $rbac.clusterRoleBinding }}{{- if hasKey . "create" }}{{- $crbCreate = .create }}{{- end }}{{- end }}
{{- if .Values.router.monitoring.prometheus.enabled }}
{{- if $crCreate }}
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ $crName }}
  labels:
    {{- include "llm-d-router.labels" . | nindent 4 }}
rules:
- apiGroups:
    - authentication.k8s.io
  resources:
    - tokenreviews
  verbs:
    - create
- apiGroups:
    - authorization.k8s.io
  resources:
    - subjectaccessreviews
  verbs:
    - create
- nonResourceURLs:
    - "/metrics"
  verbs:
    - get
---
{{- end }}
{{- if $crbCreate }}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "llm-d-router.cluster-rbac-name" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "llm-d-router.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $crName }}
{{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ printf "%s-sa" (include "llm-d-router.name" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-router.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ printf "%s-sa" (include "llm-d-router.name" .) }}
  namespace: {{ .Release.Namespace }}
subjects:
- kind: ServiceAccount
  name: {{ include "llm-d-router.name" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ printf "%s-sa" (include "llm-d-router.name" .) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "llm-d-router.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-router.labels" . | nindent 4 }}
---
{{- end }}
