{{- /*
  Render (tokenizer) endpoint for the EPP `token-producer` plugin.

  THREE TOPOLOGIES, one knob — `render.mode`:

    none        no render endpoint. Correct whenever the EPP plugin chain has no
                `token-producer` (load-aware routing, approximate prefix
                routing). Tokenization is not free; do not deploy it unused.

    service     a Service with NO pods of its own, fronting the model server
                pods — `vllm serve` already exposes /v1/{completions,chat/completions}/render. Render
                capacity scales with the serving fleet instead of with a
                separately-scheduled pool, which keeps render latency (it sits
                inside TTFT) contained as QPS climbs. This is the llm-d v0.9.0
                default for vLLM backends.

    standalone  a dedicated GPU-less `vllm launch render` Deployment behind the
                same Service name. REQUIRED for SGLang, which does not implement
                vLLM's render endpoints, and for anyone who would rather not
                spend model-server CPU on tokenization.

  The EPP sidecar is a FOURTH option and lives in the router chart
  (`router.tokenizer.enabled`), off by default in both upstream v0.10.0 and
  here. Set `render.mode: none` when you use it.

  All modes publish the same Service name, so the router's token-producer
  `vllm.url` never changes.
*/ -}}
{{- $mode := .Values.render.mode | default (ternary "standalone" "none" (.Values.render.enabled | default false)) }}
{{- if ne $mode "none" }}
{{- $r := .Values.render }}
{{- if eq $mode "standalone" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llm-d-modelserver.renderName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-modelserver.labels" . | nindent 4 }}
spec:
  replicas: {{ $r.replicas }}
  selector:
    matchLabels:
      {{- include "llm-d-modelserver.renderSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llm-d-modelserver.renderSelectorLabels" . | nindent 8 }}
        {{- with $r.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $r.annotations }}
      annotations:
        {{- range $k, $v := . }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- end }}
    spec:
      # The renderer only tokenizes over HTTP; no Kubernetes API access needed.
      automountServiceAccountToken: false
      {{- with $r.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: vllm-render
          # GPU-less image: `vllm launch render` tokenizes only, no weights.
          image: "{{ $r.image.repository }}:{{ $r.image.tag | default (include "llm-d-modelserver.id.vllmVersion" .) }}"
          imagePullPolicy: {{ $r.image.pullPolicy }}
          {{- with $r.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["vllm", "launch", "render"]
          args:
            - "{{ include "llm-d-modelserver.id.model" . }}"
            - "--port={{ $r.port }}"
          ports:
            - name: render-http
              containerPort: {{ $r.port }}
          env:
            # Points at the emptyDir below so tokenizer files are cached for
            # the pod's lifetime.
            - name: HF_HOME
              value: /tmp/hf
            {{- if .Values.hfTokenSecret.enabled }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "llm-d-modelserver.id.hfSecretName" . }}
                  key: {{ include "llm-d-modelserver.id.hfSecretKey" . }}
            {{- end }}
            - name: DO_NOT_TRACK
              value: "1"
          resources:
            {{- toYaml $r.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: render-http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: hf-cache
              mountPath: /tmp/hf
            {{- with $r.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: hf-cache
          emptyDir: {}
        {{- with $r.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $r.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $r.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  # Named from the guide label, matching what the router's token-producer
  # defaults to: http://<guide>-render:8000.
  name: {{ include "llm-d-modelserver.renderName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "llm-d-modelserver.labels" . | nindent 4 }}
  {{- with $r.serviceAnnotations }}
  annotations:
    {{- range $k, $v := . }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
  {{- end }}
spec:
  selector:
    {{- if eq $mode "standalone" }}
    {{- include "llm-d-modelserver.renderSelectorLabels" . | nindent 4 }}
    {{- else }}
    {{- /*
      mode=service: no pods of our own — select the model server pods whose port
      8000 is vLLM itself. Only Ready endpoints receive traffic, so a render call
      never lands on a pod still loading weights; but until the first server is
      Ready this Service has no endpoints and token-producer calls fail. Deploy
      the model servers before sending traffic at the router.
    */}}
    llm-d.ai/guide: {{ include "llm-d-modelserver.id.guide" . | quote }}
    llm-d.ai/role: {{ include "llm-d-modelserver.renderSelectorRole" . | quote }}
    {{- end }}
  ports:
    - name: render-http
      port: {{ $r.port }}
      {{- if eq $mode "standalone" }}
      targetPort: render-http
      {{- else }}
      # Named container port on the model server pods.
      targetPort: {{ $r.modelServerPortName | default "modelserver" }}
      {{- end }}
      protocol: TCP
{{- end }}
