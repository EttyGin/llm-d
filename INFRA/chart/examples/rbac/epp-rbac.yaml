# =============================================================================
# The EPP ClusterRole to PRE-PROVISION (needs cluster-admin), then point the
# chart at it with:  examples/values-byo-clusterrole.yaml  (create:false +
# existingName). The chart creates the ClusterRoleBinding to it — you only need
# this ClusterRole; you do NOT pre-create the binding.
#
# Rendered with placeholders `release` / `namespace` — replace with your Helm
# release name and namespace, e.g.:
#     sed 's/\brelease\b/ppc/g; s/\bnamespace\b/llm-d/g' epp-rbac.yaml | kubectl apply -f -
#
# The name here (`<release>-<namespace>-epp`) is just the chart's default — you
# may name your ClusterRole anything and put that in existingName. This
# ClusterRole is only *used* when EPP metrics auth is on; with auth off (default)
# the EPP runs fine without it.
#
# (Fully pre-provisioned instead? Create this ClusterRole AND a ClusterRoleBinding
#  binding the `<release>-epp` ServiceAccount to it, then set create:false with
#  existingName EMPTY so the chart makes nothing cluster-scoped.)
# =============================================================================
# Source: llm-d/charts/llm-d-router/charts/llmd/templates/rbac.yaml
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: "release-namespace-epp"
  labels:
    app.kubernetes.io/name: release-epp
    app.kubernetes.io/version: "v0.10.0"
rules:
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
  - nonResourceURLs:
      - "/metrics"
    verbs:
      - get
