{{- $cfg := .Values.prefill -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prefill
  labels:
    {{- include "dsv4.labels" . | nindent 4 }}
    llm-d.ai/role: prefill
spec:
  replicas: {{ $cfg.replicas }}
  selector:
    matchLabels:
      {{- include "dsv4.selectorLabels" (dict "root" . "role" "prefill") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dsv4.labels" . | nindent 8 }}
        {{- include "dsv4.selectorLabels" (dict "root" . "role" "prefill") | nindent 8 }}
        llm-d.ai/inference-serving: "true"
      {{- if .Values.monitoring.podMonitor }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
      {{- end }}
    spec:
      serviceAccountName: {{ include "dsv4.serviceAccountName" . }}
      {{- with $cfg.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $cfg.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # One replica == one self-contained DP group. Without LeaderWorkerSet the
      # group never spans pods, so every DEP rank must land on one node and the
      # all-to-all stays on NVLink.
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $cfg.dshmSize }}
        - name: hf-cache
          emptyDir: {}
        - name: jit-cache
          emptyDir: {}
        - name: vllm-config
          emptyDir: {}
        {{- if eq (toString .Values.offloading.mode) "tiered" }}
        - name: nvme-cache
          hostPath:
            path: {{ .Values.offloading.nvmeHostPath }}
            type: DirectoryOrCreate
        {{- end }}
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            capabilities:
              add:
                # IPC_LOCK: pin the NIXL/NVSHMEM registered memory.
                # SYS_RAWIO: GDRCopy / GPUDirect device access.
                - IPC_LOCK
                - SYS_RAWIO
          # Clear offload-tier mmaps left behind by a previous pod on this node
          # before starting, or /dev/shm fills up across restarts.
          command: ["sh", "-c", "rm -f /dev/shm/vllm_offload_*.mmap 2>/dev/null; exec vllm serve \"$@\"", "sh"]
          args:
            {{- include "dsv4.vllmArgs" (dict "root" . "role" "prefill" "cfg" $cfg "port" 8000) | nindent 12 }}
            {{- if .Values.kvEvents.enabled }}
            - "--kv-events-config"
            - '{"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:{{ .Values.kvEvents.basePort }}","topic":"kv@$(POD_IP):8000@{{ .Values.model.name }}"}'
            {{- end }}
          env:
            {{- include "dsv4.commonEnv" (dict "root" . "role" "prefill") | nindent 12 }}
            {{- with $cfg.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if eq .Values.dp.lbMode "multiport" }}
            {{- range $i := until (int $cfg.dataParallelSize) }}
            - name: dp{{ $i }}
              containerPort: {{ add 8000 $i }}
              protocol: TCP
            {{- end }}
            - name: supervisor
              containerPort: 8208
              protocol: TCP
            {{- else }}
            - name: modelserver
              containerPort: 8000
              protocol: TCP
            {{- end }}
            - name: nixl
              containerPort: 5600
              protocol: TCP
            {{- if .Values.p2p.enabled }}
            - name: p2p
              containerPort: {{ .Values.p2p.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.kvEvents.enabled }}
            {{- range $i := until (int $cfg.dataParallelSize) }}
            - name: kv-events-{{ $i }}
              containerPort: {{ add ($.Values.kvEvents.basePort | int) $i }}
              protocol: TCP
            {{- end }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: {{ if eq .Values.dp.lbMode "multiport" }}supervisor{{ else }}modelserver{{ end }}
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            # 304B of weights over the network on first pull, plus EP shard
            # loading and CUDA graph capture: allow 90 minutes.
            failureThreshold: 540
          livenessProbe:
            httpGet:
              path: /health
              port: {{ if eq .Values.dp.lbMode "multiport" }}supervisor{{ else }}modelserver{{ end }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ if eq .Values.dp.lbMode "multiport" }}/readyz{{ else }}/v1/models{{ end }}
              port: {{ if eq .Values.dp.lbMode "multiport" }}supervisor{{ else }}modelserver{{ end }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              {{- toYaml $cfg.resources.requests | nindent 14 }}
              nvidia.com/gpu: {{ $cfg.gpus | quote }}
              {{- if .Values.infiniband.enabled }}
              rdma/ib: {{ .Values.infiniband.devices | quote }}
              {{- end }}
            limits:
              {{- toYaml $cfg.resources.limits | nindent 14 }}
              nvidia.com/gpu: {{ $cfg.gpus | quote }}
              {{- if .Values.infiniband.enabled }}
              rdma/ib: {{ .Values.infiniband.devices | quote }}
              {{- end }}
          volumeMounts:
            {{- include "dsv4.cacheVolumeMounts" . | nindent 12 }}
            {{- if eq (toString .Values.offloading.mode) "tiered" }}
            - name: nvme-cache
              mountPath: {{ .Values.offloading.nvmePath }}
            {{- end }}
{{- if .Values.nodeExporter.enabled }}
        - name: node-exporter
          image: {{ .Values.nodeExporter.image }}
          args:
            - --collector.disable-defaults
            - --collector.infiniband
            - --collector.netstat
            - --collector.pressure
            - --collector.cpu
          ports:
            - name: node-metrics
              containerPort: 9100
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
{{- end }}
