apiVersion: "inference.networking.k8s.io/v1"
kind: InferencePool
metadata:
  name: precise-prefix-cache-routing
  namespace: llm-d-precise-prefix-cache-routing
  labels:
    app.kubernetes.io/name: precise-prefix-cache-routing-epp
    app.kubernetes.io/version: "v0.10.0"
spec:
  targetPorts:
  - number: 8000
  appProtocol: "http"
  selector:
    matchLabels:
      llm-d.ai/guide: "precise-prefix-cache-routing"
  endpointPickerRef:
    name: precise-prefix-cache-routing-epp
    port:
      number: 9002
    failureMode: FailOpen
