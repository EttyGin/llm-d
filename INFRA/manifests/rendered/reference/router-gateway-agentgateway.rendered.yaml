# Source: llm-d-router-gateway/templates/epp.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: precise-prefix-cache-routing-epp
  namespace: llm-d-precise-prefix-cache-routing
data:
  default-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: kv-cache-utilization-scorer
    - type: prefix-cache-scorer
    - type: metrics-data-source
      parameters:
        scheme: "http"
        path: "/metrics"
        insecureSkipVerify: true
    - type: core-metrics-extractor
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: queue-scorer
        weight: 2
      - pluginRef: kv-cache-utilization-scorer
        weight: 2
      - pluginRef: prefix-cache-scorer
        weight: 3
  payload-agnostic.yaml: |
    # Request-format agnostic routing. Use this when the request format is
    # unknown or unsupported, so the EPP cannot rely on scorers that read the
    # request body (e.g. the prefix-cache scorer). The passthrough parser does
    # not parse the body, and routing falls back to backend-state scorers:
    #   - active-request-scorer  : prefers the least busy endpoint
    #   - session-affinity-scorer: keeps a session pinned to the same endpoint
    # Select it by setting router.epp.pluginsConfigFile: payload-agnostic.yaml
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: passthrough-parser
    - type: active-request-scorer
    - type: session-affinity-scorer
    requestHandler:
      parsers:
      - pluginRef: passthrough-parser
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: active-request-scorer
        weight: 1
      - pluginRef: session-affinity-scorer
        weight: 1
  precise-prefix-cache-routing-plugins.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
      - type: token-producer
        parameters:
          # Must match the model the overlay deploys: with the default
          # `../render/` overlay the render call lands on the model servers
          # themselves, so a mismatch is rejected rather than silently
          # producing token IDs from the wrong tokenizer.
          modelName: Qwen/Qwen3-32B
          vllm:
            # Guide render Service (../render/), not a loopback sidecar.
            # `precise-prefix-cache-routing-` namePrefix + Service name `render`.
            url: "http://precise-prefix-cache-routing-render:8000"
      - type: endpoint-notification-source
      - type: precise-prefix-cache-producer # `precise-prefix-cache-scorer` is deprecated
        parameters:
          tokenProcessorConfig:
            blockSizeTokens: 64
          speculativeIndexing: true
          indexerConfig:
            kvBlockIndexConfig:
              enableMetrics: true
          kvEventsConfig:
            topicFilter: "kv@"
            concurrency: 8
            discoverPods: true
            podDiscoveryConfig:
              socketPort: 5556
              replaySocketPort: 5559
      - type: inflight-load-producer
        parameters:
          prefixMatchInfoProducerName: precise-prefix-cache-producer
      - type: prefix-cache-affinity-filter
        parameters:
          # Exact resident-block fractions from KV-cache events, not the
          # approximate producer.
          prefixMatchInfoProducerName: precise-prefix-cache-producer
          # Measured with guides/recipes/router/calibration/calibrate.sh on
          # this guide's reference setup (Qwen3-32B, H100 80 GB, TP=2,
          # chunk 8192) — SGLang measures the same value as vLLM. Re-measure
          # for other hardware/models.
          peakPrefillThroughput: 15926
      - type: token-load-scorer
    dataLayer: # metrics-data-source + core-metrics-extractor injected by default
      sources:
        - pluginRef: endpoint-notification-source
          extractors:
            - pluginRef: precise-prefix-cache-producer
    schedulingProfiles:
      - name: default
        plugins:
          - pluginRef: prefix-cache-affinity-filter
          - pluginRef: token-load-scorer
---
