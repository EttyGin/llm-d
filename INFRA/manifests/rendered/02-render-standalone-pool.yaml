apiVersion: v1
kind: Service
metadata:
  labels:
    llm-d.ai/guide: precise-prefix-cache-routing
  name: precise-prefix-cache-routing-render
spec:
  ports:
  - name: render-http
    port: 8000
    protocol: TCP
    targetPort: render-http
  selector:
    app.kubernetes.io/component: vllm-render
    app.kubernetes.io/part-of: precise-prefix-cache-routing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    llm-d.ai/guide: precise-prefix-cache-routing
  name: precise-prefix-cache-routing-render
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: vllm-render
      app.kubernetes.io/part-of: precise-prefix-cache-routing
  template:
    metadata:
      labels:
        app.kubernetes.io/component: vllm-render
        app.kubernetes.io/part-of: precise-prefix-cache-routing
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - Qwen/Qwen3-32B
        - --port=8000
        command:
        - vllm
        - launch
        - render
        env:
        - name: HF_HOME
          value: /tmp/hf
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: HF_TOKEN
              name: llm-d-hf-token
        - name: DO_NOT_TRACK
          value: "1"
        - name: USER
          value: llm-d
        image: docker.io/vllm/vllm-openai-cpu:v0.26.0
        imagePullPolicy: IfNotPresent
        name: vllm-render
        ports:
        - containerPort: 8000
          name: render-http
        readinessProbe:
          failureThreshold: 60
          httpGet:
            path: /health
            port: render-http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: "4"
            memory: 12Gi
          requests:
            cpu: "1"
            memory: 4Gi
        volumeMounts:
        - mountPath: /tmp/hf
          name: hf-cache
      volumes:
      - emptyDir: {}
        name: hf-cache
